<!doctype html>
<html lang="en" data-demo-page="login">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
  <title>Login · Demo portal</title>
  <link rel="icon" href="./My account_files/img/nu-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./Login_files/local-login.css">
  <script defer src="./assets/demo-session.js"></script>
</head>
<body>
  <main class="login-card" aria-labelledby="login-title">
    <img class="anniversary-logo" src="./Login_files/images/anniversary-logo.png" width="200" height="68" alt="15 Years Anniversary">
    <h1 id="login-title">Welcome to the internal information portal of<br>NAZARBAYEV UNIVERSITY</h1>
    <p class="demo-note">Demo mode · use any test values.<br>No real credentials required.</p>
    <form id="demo-login" autocomplete="off">
      <label class="login-field" for="demo-username">
        <span class="visually-hidden">Demo username</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21v-3a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v3z"/></svg>
        <input id="demo-username" type="text" placeholder="Username" autocomplete="off" autocapitalize="none" spellcheck="false">
      </label>
      <label class="login-field" for="demo-password">
        <span class="visually-hidden">Demo password (optional)</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3m-5 5v3"/></svg>
        <input id="demo-password" type="password" placeholder="Password (optional)" autocomplete="off">
      </label>
      <button type="submit">LOGIN</button>
      <p class="login-error" id="login-error" role="alert"></p>
    </form>
    <noscript><p>Enable JavaScript to open this local demo.</p></noscript>
  </main>
</body>
</html>
